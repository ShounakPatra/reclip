<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1eb">
<title>ReClip — Free Media Downloader</title>
<style>
:root{--bg:#f4f1eb;--fg:#353532;--accent:#e85d2a;--accent2:#d45122;--muted:#999286;--card:#fff;--border:#e2ded6;--soft:#f8f6f2;--ok:#2d8a4e;--bad:#c43d3d;--warn:#8a4d2d;--warnbg:#fff7f0;--radius:16px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
.page{width:min(760px,100%);margin:auto;padding:56px 22px 72px}
.brand{margin-bottom:36px}.brand h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(3.5rem,10vw,5.6rem);font-weight:400;letter-spacing:-.07em;line-height:.9}.brand h1 em{color:var(--accent);font-style:italic}.brand p{margin:14px 0 0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.input{display:block;width:100%;min-height:126px;padding:18px 19px;border:1.5px solid var(--border);border-radius:var(--radius);background:rgba(255,255,255,.9);font:14px/1.55 inherit;color:var(--fg);resize:vertical;outline:0;box-shadow:0 10px 30px rgba(40,38,32,.04)}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(232,93,42,.08),0 10px 30px rgba(40,38,32,.04)}
.hint{margin:9px 2px 18px;font-size:10px;line-height:1.5;color:var(--muted)}
.controls{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:stretch}.pills{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1.5px solid var(--border);border-radius:12px;overflow:hidden}.pill{min-width:78px;border:0;background:transparent;color:var(--muted);padding:11px 16px;font:12px inherit;cursor:pointer}.pill.active{background:var(--fg);color:var(--bg)}
.fetch{min-height:46px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:12px inherit;font-weight:500;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}.fetch:hover{background:var(--accent2)}.fetch:disabled{opacity:.55;cursor:wait}
.cards{margin-top:24px}.card{display:grid;grid-template-columns:160px minmax(0,1fr);gap:16px;align-items:start;padding:15px;margin:0 0 12px;border:1.5px solid var(--border);border-radius:var(--radius);background:var(--card);box-shadow:0 10px 30px rgba(40,38,32,.04);overflow:hidden}.card-main{min-width:0}.thumb{width:100%;aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:var(--soft);border:1px solid rgba(0,0,0,.03)}.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.title{margin:1px 0 6px;font-family:Georgia,"Times New Roman",serif;font-size:19px;line-height:1.18;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}.meta{margin-bottom:10px;color:var(--muted);font-size:10px;line-height:1.45;text-transform:uppercase;overflow-wrap:anywhere}.qualities{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.q{border:1px solid var(--border);background:transparent;border-radius:7px;padding:6px 9px;color:var(--muted);font:10px inherit;cursor:pointer}.q.active{border-color:var(--fg);color:var(--fg);background:rgba(52,52,50,.045)}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.download,.source-btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:8px;padding:9px 13px;font:10px inherit;font-weight:500;letter-spacing:.04em;text-transform:uppercase;text-decoration:none;cursor:pointer;white-space:nowrap}.download{background:var(--fg);color:var(--bg)}.source-btn{background:var(--accent);color:#fff}.download:disabled{opacity:.5;cursor:wait}.status{color:var(--muted);font-size:10px;line-height:1.4;overflow-wrap:anywhere}.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}
.notice{display:flex;gap:9px;align-items:flex-start;padding:11px 12px;margin:0 0 10px;border:1px solid #efd4c0;background:var(--warnbg);border-radius:10px;color:var(--warn);font-size:10px;line-height:1.55;overflow-wrap:anywhere}.notice-dot{width:7px;height:7px;margin-top:4px;border-radius:50%;background:var(--accent);flex:none}.error{color:var(--bad);font-size:11px;line-height:1.55;overflow-wrap:anywhere}.loading{display:inline-block;width:10px;height:10px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .6s linear infinite;vertical-align:-1px;margin-right:5px}.footer{text-align:center;color:var(--muted);font-size:9px;line-height:1.9;margin-top:42px;letter-spacing:.04em;text-transform:uppercase}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:640px){.page{padding:38px 14px 58px}.controls{grid-template-columns:1fr}.pills{width:100%}.fetch{width:100%}.card{grid-template-columns:1fr;gap:12px}.thumb{aspect-ratio:16/9}.title{font-size:18px}}
</style>
</head>
<body>
<main class="page">
<section class="brand"><h1>Re<em>Clip</em></h1><p>Free media downloader</p></section>
<textarea id="urls" class="input" rows="4" placeholder="Paste one or more URLs..."></textarea>
<div class="hint">Multiple links: separate with spaces, commas, or new lines. Up to 10 links per batch.</div>
<div class="controls">
<div class="pills"><button type="button" class="pill active" data-format="video">MP4</button><button type="button" class="pill" data-format="audio">MP3</button></div>
<button type="button" id="fetch" class="fetch">Fetch media</button>
</div>
<div id="cards" class="cards"></div>
<div class="footer">YouTube · TikTok · Instagram · Twitter/X · Reddit · Facebook<br>Vimeo · Twitch · Dailymotion · SoundCloud · Loom · Streamable<br>Pinterest · Tumblr · Threads · LinkedIn · 1000+ more</div>
</main>
<script>
(function(){
'use strict';
var mode='video';
var urls=document.getElementById('urls');
var cards=document.getElementById('cards');
var fetchButton=document.getElementById('fetch');
var pills=document.querySelectorAll('.pill');

for(var i=0;i<pills.length;i++){
  pills[i].addEventListener('click',function(){
    for(var j=0;j<pills.length;j++){pills[j].classList.remove('active');}
    this.classList.add('active');
    mode=this.getAttribute('data-format')||'video';
  });
}

function escapeHtml(value){
  var div=document.createElement('div');
  div.textContent=value==null?'':String(value);
  return div.innerHTML;
}
function durationText(value){
  if(!value)return '';
  var seconds=Math.floor(Number(value));
  return Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');
}
function parseUrls(){
  var raw=urls.value.split(/[\s,]+/);
  var result=[];
  var seen={};
  for(var i=0;i<raw.length;i++){
    var u=raw[i].trim();
    if(!/^https?:\/\//i.test(u) || seen[u])continue;
    seen[u]=true; result.push(u);
    if(result.length===10)break;
  }
  return result;
}
function showLoading(u){
  var d=document.createElement('div');
  d.className='card';
  d.innerHTML='<div class="thumb"></div><div class="card-main"><div class="title">Fetching media...</div><div class="meta">'+escapeHtml(u)+'</div><div class="status"><span class="loading"></span>Reading media information</div></div>';
  cards.appendChild(d);
  return d;
}
async function getInfo(url){
  var response=await fetch('/api/info',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url})});
  var text=await response.text();
  var data=null;
  try{data=JSON.parse(text);}catch(e){}
  if(!response.ok){throw new Error(data&&data.error?data.error:'ReClip could not process this link (HTTP '+response.status+').');}
  if(!data){throw new Error('ReClip received an invalid server response. Please try again.');}
  return data;
}
function buildCard(data){
  var card=document.createElement('div');
  card.className='card';
  var thumb=data.thumbnail?'<img src="'+escapeHtml(data.thumbnail)+'" alt="">':'';
  var meta=(data.uploader?escapeHtml(data.uploader):'')+(data.duration?' · '+durationText(data.duration):'');
  var main=document.createElement('div');
  main.className='card-main';
  var title=document.createElement('div'); title.className='title'; title.textContent=data.title||'Untitled';
  var metaEl=document.createElement('div'); metaEl.className='meta'; metaEl.innerHTML=meta;
  main.appendChild(title); main.appendChild(metaEl);
  if(data.downloadable===false){
    var notice=document.createElement('div'); notice.className='notice';
    notice.innerHTML='<span class="notice-dot"></span><div>'+escapeHtml(data.notice||'YouTube currently requires additional verification for server-side downloads.')+'</div>';
    main.appendChild(notice);
    var actions=document.createElement('div'); actions.className='actions';
    var source=document.createElement('a'); source.className='source-btn'; source.href=data.webpage_url||'#'; source.target='_blank'; source.rel='noopener noreferrer'; source.textContent='Open on YouTube';
    var status=document.createElement('span'); status.className='status'; status.textContent='Download is unavailable for this source right now.';
    actions.appendChild(source); actions.appendChild(status); main.appendChild(actions);
  }else{
    var formats=document.createElement('div'); formats.className='qualities';
    var list=data.formats||[];
    for(var i=0;i<list.length;i++){
      var q=document.createElement('button'); q.type='button'; q.className='q'+(i===0?' active':''); q.textContent=list[i].label; q.setAttribute('data-id',list[i].id||'');
      q.addEventListener('click',function(){var all=formats.querySelectorAll('.q');for(var k=0;k<all.length;k++)all[k].classList.remove('active');this.classList.add('active');});
      formats.appendChild(q);
    }
    if(!list.length){var noQ=document.createElement('span');noQ.className='status';noQ.textContent='Best available quality';formats.appendChild(noQ);}
    main.appendChild(formats);
    var actions2=document.createElement('div');actions2.className='actions';
    var download=document.createElement('button');download.type='button';download.className='download';download.textContent='Download';
    var downloadStatus=document.createElement('span');downloadStatus.className='status';
    download.addEventListener('click',async function(){
      download.disabled=true; downloadStatus.className='status'; downloadStatus.textContent='Preparing...';
      var active=formats.querySelector('.q.active');
      try{
        var response=await fetch('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:data.webpage_url,format:mode,format_id:active?active.getAttribute('data-id'):null,title:data.title||''})});
        var contentType=response.headers.get('content-type')||'';
        if(!response.ok){var body=await response.text();var errorData=null;try{errorData=JSON.parse(body);}catch(e){}throw new Error(errorData&&errorData.error?errorData.error:'Download failed (HTTP '+response.status+').');}
        if(contentType.indexOf('video')===-1&&contentType.indexOf('audio')===-1&&contentType.indexOf('octet-stream')===-1){throw new Error('The server did not return a media file.');}
        var blob=await response.blob();
        var link=document.createElement('a');
        link.href=URL.createObjectURL(blob);
        var clean=(data.title||'reclip').replace(/[^a-z0-9 _.-]/gi,'').slice(0,80)||'reclip';
        link.download=clean+(mode==='audio'?'.mp3':'.mp4');
        document.body.appendChild(link); link.click(); link.remove();
        setTimeout(function(){URL.revokeObjectURL(link.href);},2000);
        download.textContent='Done'; downloadStatus.className='status ok'; downloadStatus.textContent='Downloaded';
      }catch(error){download.textContent='Retry';downloadStatus.className='status bad';downloadStatus.textContent=error&&error.message?error.message:'Download failed.';}
      download.disabled=false;
    });
    actions2.appendChild(download); actions2.appendChild(downloadStatus); main.appendChild(actions2);
  }
  var thumbWrap=document.createElement('div');thumbWrap.className='thumb';thumbWrap.innerHTML=thumb;
  card.appendChild(thumbWrap);card.appendChild(main);
  return card;
}
async function runFetch(){
  var list=parseUrls();
  if(!list.length){urls.focus();return;}
  fetchButton.disabled=true;
  fetchButton.textContent='Fetching...';
  cards.innerHTML='';
  for(var i=0;i<list.length;i++){
    var loader=showLoading(list[i]);
    try{var data=await getInfo(list[i]);loader.replaceWith(buildCard(data));}
    catch(error){loader.innerHTML='<div class="thumb"></div><div class="card-main"><div class="error">'+escapeHtml(error&&error.message?error.message:'Unable to process this link.')+'</div><div class="meta">'+escapeHtml(list[i])+'</div></div>';}
  }
  fetchButton.disabled=false;
  fetchButton.textContent='Fetch media';
}
fetchButton.addEventListener('click',runFetch);
urls.addEventListener('keydown',function(event){if((event.ctrlKey||event.metaKey)&&event.key==='Enter'){event.preventDefault();runFetch();}});
})();
</script>
</body>
</html>

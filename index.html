<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f1eb"><title>ReClip — Free Media Downloader</title><style>:root{--bg:#f4f1eb;--fg:#3a3a38;--accent:#e85d2a;--accent2:#d04e1f;--muted:#9c9889;--card:#fff;--border:#e2ded6;--ok:#2d8a4e;--bad:#c43d3d;--r:14px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;min-height:100vh}.page{width:min(680px,100%);margin:auto;padding:48px 18px 70px}.brand{margin-bottom:34px}.brand h1{font-family:Georgia,serif;font-size:clamp(3.2rem,14vw,5rem);font-weight:400;letter-spacing:-.06em;line-height:.9;margin:0}.brand h1 em{color:var(--accent);font-style:italic}.brand p{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin:13px 0 0}.input{width:100%;min-height:112px;padding:17px;border:1.5px solid var(--border);border-radius:var(--r);background:var(--card);font:14px/1.55 inherit;color:var(--fg);resize:vertical;outline:0}.hint{font-size:10px;color:var(--muted);margin:8px 2px 18px}.controls{display:flex;gap:9px}.pills{display:flex;background:var(--card);border:1.5px solid var(--border);border-radius:11px;overflow:hidden}.pill{border:0;background:transparent;color:var(--muted);padding:11px 15px;font:11px inherit;cursor:pointer}.pill.active{background:var(--fg);color:var(--bg)}.fetch{flex:1;border:0;border-radius:11px;background:var(--accent);color:#fff;font:12px inherit;text-transform:uppercase;cursor:pointer}.fetch:disabled{opacity:.5}.cards{margin-top:24px}.card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:13px;margin:0 0 10px;display:grid;grid-template-columns:140px 1fr;gap:14px}.thumb{width:140px;height:92px;border-radius:9px;overflow:hidden;background:#ebe8e2}.thumb img{width:100%;height:100%;object-fit:cover}.title{font-family:Georgia,serif;font-size:17px;line-height:1.2;margin:2px 0 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta,.status{font-size:10px;color:var(--muted)}.meta{text-transform:uppercase;margin-bottom:9px}.qualities{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}.q{border:1px solid var(--border);background:transparent;border-radius:6px;padding:5px 8px;font:10px inherit;color:var(--muted);cursor:pointer}.q.active{border-color:var(--fg);color:var(--fg)}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.download,.open{border:0;border-radius:7px;background:var(--fg);color:var(--bg);padding:8px 12px;font:10px inherit;text-transform:uppercase;cursor:pointer;text-decoration:none}.open{background:var(--accent)}.notice{padding:10px 12px;border:1px solid #e8c9b6;background:#fff8f2;border-radius:9px;color:#8a4d2d;font-size:10px;line-height:1.55;margin-bottom:9px}.error{color:var(--bad);font-size:11px;line-height:1.45}.footer{text-align:center;color:var(--muted);font-size:9px;line-height:1.9;margin-top:42px;text-transform:uppercase}@media(max-width:520px){.page{padding:36px 14px 56px}.controls{flex-wrap:wrap}.pills{width:100%}.pill{flex:1}.fetch{width:100%;min-height:44px}.card{grid-template-columns:1fr}.thumb{width:100%;height:180px}.title{white-space:normal}}
</style></head><body><main class="page"><section class="brand"><h1>Re<em>Clip</em></h1><p>Free media downloader</p></section><textarea id="urls" class="input" rows="3" placeholder="Paste one or more URLs..."></textarea><div class="hint">Multiple links: separate with spaces, commas, or new lines.</div><div class="controls"><div class="pills"><button class="pill active" data-format="video">MP4</button><button class="pill" data-format="audio">MP3</button></div><button id="fetch" class="fetch">Fetch</button></div><div id="cards" class="cards"></div><div class="footer">YouTube · TikTok · Instagram · Twitter/X · Reddit · Facebook<br>Vimeo · Twitch · Dailymotion · SoundCloud · Loom · Streamable<br>Pinterest · Tumblr · Threads · LinkedIn · 1000+ more</div></main><script>
let mode='video';const $=s=>document.querySelector(s),cards=$('#cards'),urls=$('#urls');document.querySelectorAll('.pill').forEach(b=>b.onclick=()=>{document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.format});function parse(){return[...new Set(urls.value.split(/[\s,]+/).map(x=>x.trim()).filter(x=>/^https?:\/\//i.test(x)))]}function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}function dur(s){if(!s)return'';s=Math.floor(s);return`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}function loading(u){const d=document.createElement('div');d.className='card';d.innerHTML=`<div class="thumb"></div><div><div class="title">Fetching…</div><div class="meta">${esc(u)}</div><div class="status">Reading media information</div></div>`;cards.appendChild(d);return d}async function info(u){const r=await fetch('/api/info',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url:u})});let j={};try{j=await r.json()}catch{throw Error('ReClip could not read the server response. Please try again.')}if(!r.ok)throw Error(j.error||'Unable to fetch this URL');return j}function card(data){const d=document.createElement('div');d.className='card';const qs=(data.formats||[]).map((f,i)=>`<button class="q ${i?'':'active'}" data-id="${esc(f.id)}">${esc(f.label)}</button>`).join('');const notice=data.notice?`<div class="notice">${esc(data.notice)}</div>`:'';const actions=data.downloadable===false?`<a class="open" href="${esc(data.webpage_url)}" target="_blank" rel="noopener noreferrer">Open source</a><span class="status">Download unavailable for this source right now.</span>`:`<button class="download">Download</button><span class="status"></span>`;d.innerHTML=`<div class="thumb">${data.thumbnail?`<img src="${esc(data.thumbnail)}" alt="">`:''}</div><div><div class="title">${esc(data.title||'Untitled')}</div><div class="meta">${esc(data.uploader||'')}${data.duration?' · '+dur(data.duration):''}</div>${notice}<div class="qualities">${qs||'<span class="status">Quality options unavailable</span>'}</div><div class="actions">${actions}</div></div>`;d.querySelectorAll('.q').forEach(q=>q.onclick=()=>{d.querySelectorAll('.q').forEach(x=>x.classList.remove('active'));q.classList.add('active')});const b=d.querySelector('.download');if(b)b.onclick=async()=>{const st=d.querySelector('.status'),q=d.querySelector('.q.active');b.disabled=true;st.textContent='Preparing…';try{const r=await fetch('/api/download',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url:data.webpage_url,format:mode,format_id:q?.dataset.id||null,title:data.title||''})});if(!r.ok){let j={};try{j=await r.json()}catch{}throw Error(j.error||'Download failed')}const blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(data.title||'reclip').replace(/[^a-z0-9 _.-]/gi,'').slice(0,80)||'reclip';a.download+=mode==='audio'?'.mp3':'.mp4';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);b.textContent='Done';st.textContent='Downloaded';st.style.color='var(--ok)'}catch(e){st.textContent=e.message;st.style.color='var(--bad)';b.textContent='Retry'}finally{b.disabled=false}};return d}async function go(){const list=parse();if(!list.length){urls.focus();return}$('#fetch').disabled=true;$('#fetch').textContent='Fetching';cards.innerHTML='';for(const u of list.slice(0,10)){const l=loading(u);try{const data=await info(u);l.replaceWith(card(data))}catch(e){l.innerHTML=`<div class="thumb"></div><div><div class="error">${esc(e.message)}</div><div class="meta">${esc(u)}</div></div>`}}$('#fetch').disabled=false;$('#fetch').textContent='Fetch'}$('#fetch').onclick=go;urls.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')go()});</script></body></html>
